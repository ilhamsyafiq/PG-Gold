name: Update PG Gold Price

on:
  workflow_dispatch:
  schedule:
    - cron: "5,35 * * * *"
  push:
    paths:
      - "scripts/scrape_pg.py"
      - ".github/workflows/update-gold.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update PG Gold data
        run: python scripts/scrape_pg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold.json
          git diff --cached --quiet || git commit -m "Update PG Gold price"
          git push
